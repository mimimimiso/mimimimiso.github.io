<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lala</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --link: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --link: #4493f8; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.8 system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: 18px; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>lala</h1>
  <p class="lead">開発者本人だけが使う、個人用の音声アシスタントです。<br>A personal voice assistant used only by its developer.</p>

  <h2>できること</h2>
  <p>開発者が声で話しかけると、アシスタントが声で答えます。開発者が頼んだときだけ、開発者本人の Google カレンダーの予定を読み上げたり、予定を追加・変更・削除したりします。</p>

  <h2>だれが使えるか</h2>
  <p>このアプリは一般には配布していません。使うのは開発者本人だけです。</p>

  <h2>プライバシー</h2>
  <p>Google のデータの扱いは、<a href="privacy.html">プライバシーポリシー</a>に書いています。</p>
</main>
</body>
</html>
